<svg width="800px"   height="600px" viewBox="0 0 200 80" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<defs>
<mask id="myMask" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="80"><rect x="0" y="0" width="100" height="80" fill="white" /></mask>
<text x="100" y="48" id="Text" font-size="26" font-weight="bold" text-anchor="middle">Black &amp; White</text>
</defs>
<title>Netkiller SVG Library</title>
<desc>https://www.netkiller.cn</desc>
<rect x="100" y="10" width="95" height="60"  />
<use xlink:href="#Text" fill="white"/>
<use xlink:href="#Text" fill="black" mask="url(#myMask)"/>
</svg>